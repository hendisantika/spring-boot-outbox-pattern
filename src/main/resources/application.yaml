spring:
  application:
    name: outbox-pattern

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:outbox_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:outbox}
    password: ${MYSQL_PASSWORD:outbox}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      group-id: ${spring.application.name}-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  outbox:
    batch-size: 100
    max-attempts: 10
    send-timeout: 10s
    retention: 7d
    max-run-duration: 1m
    relay:
      enabled: true
      poll-interval: 1000
      initial-delay: 5000
      # ShedLock: hanya satu instance yang menjalankan relay pada satu waktu
      lock-at-most-for: PT5M
      lock-at-least-for: PT0S
    cleanup:
      cron: "0 0 * * * *"
